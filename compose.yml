services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: backupr-server
    # MAIL_*, APP_URL and the notification tuning vars come straight from .env;
    # don't re-list them under environment, which overrides env_file and turns
    # anything compose can't interpolate into an empty string.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5174
      - BUN_GC=aggressive
      - TZ=America/Sao_Paulo
      # Proxies in front of the server that append to X-Forwarded-For
      # (outer reverse proxy -> backupr_proxy). Used for rate limiting by client IP.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-2}
    networks:
      backupr_network:
        aliases:
          - backupr-server
      web_network:
        aliases:
          - backupr-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5174/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_TZ=America/Sao_Paulo
    container_name: backupr-web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      backupr_network: {}
      web_network:
        aliases:
          - backupr_web
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backupr_proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    container_name: backupr_proxy
    networks:
      backupr_network: {}
      web_network:
        aliases:
          - backupr_proxy
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  backupr_network:
    driver: bridge
    name: backupr_network
  web_network:
    external: true
    name: mkserver-shared
