services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: backupr-server
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5174
      - BUN_GC=aggressive
      - TZ=America/Sao_Paulo
      # Proxies in front of the server that append to X-Forwarded-For
      # (outer reverse proxy -> backupr_proxy). Used for rate limiting by client IP.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-2}
      # Email notifications (interpolated from the shell or the root .env)
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Backupr}
      - APP_URL=${APP_URL:-}
      - STALE_AFTER_DAYS=${STALE_AFTER_DAYS:-5}
      - STALE_REMINDER_DAYS=${STALE_REMINDER_DAYS:-2}
      - FAILURE_COOLDOWN_MINUTES=${FAILURE_COOLDOWN_MINUTES:-60}
      - WEEKLY_REPORT_DAY=${WEEKLY_REPORT_DAY:-1}
      - WEEKLY_REPORT_HOUR=${WEEKLY_REPORT_HOUR:-8}
    networks:
      backupr_network:
        aliases:
          - backupr-server
      web_network:
        aliases:
          - backupr-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5174/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_TZ=America/Sao_Paulo
    container_name: backupr-web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      backupr_network: {}
      web_network:
        aliases:
          - backupr_web
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backupr_proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    container_name: backupr_proxy
    networks:
      backupr_network: {}
      web_network:
        aliases:
          - backupr_proxy
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  backupr_network:
    driver: bridge
    name: backupr_network
  web_network:
    external: true
    name: mkserver-shared
